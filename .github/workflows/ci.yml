name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs WITHOUT `--features plugins` on purpose: this job is the Pillar VI.4
  # guard that the lean build (no Extism, no WASM dependency tree) keeps
  # compiling, linting and passing. Do not replace it with the feature job
  # below — the two cover different configurations, not the same one twice.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      # CONTRACT.md:114 sets a hard ceiling of 200 lines per document; nothing
      # failed closed on it, so the entry point drifted past it. Runs here rather
      # than as its own job so the `gate` wiring keeps its exact three legs.
      - name: Documentation line budget
        if: matrix.os == 'ubuntu-latest'
        run: |
          status=0
          for file in README.md $(find docs -type f -name '*.md' | sort); do
            lines=$(wc -l < "$file" | tr -d ' ')
            if [ "$lines" -gt 200 ]; then
              echo "::error file=$file::$file has $lines lines; the ceiling is 200 (CONTRACT.md:114)"
              status=1
            fi
          done
          exit $status

  # Covers the `plugins` feature: Extism, the WASM driver, and the seven
  # `#[cfg(feature = "plugins")]` sites under src/. Without this job the whole
  # WebAssembly path is never compiled, including tests/wasm_plugin.rs, which is
  # gated behind `#![cfg(feature = "plugins")]`.
  #
  # All three OSes, because the feature is platform-sensitive: the plugin cache
  # resolves $HOME, which is normally unset on Windows.
  #
  # No `target` matrix key here: the job above declares one that no step
  # consumes, and these runners already are the declared triples.
  test-plugins:
    name: Test with plugins feature (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: plugins-feature
      - name: Build
        run: cargo build --locked --workspace --all-targets --features plugins
      - name: Test
        run: cargo test --locked --workspace --features plugins
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --workspace --all-targets --features plugins -- -D warnings

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked

  # The single status check the `main` ruleset requires. Requiring the eight per-matrix
  # names directly would bind branch protection to the matrix: delete a leg and its check
  # stays expected forever, blocking every merge; add one and it is silently unrequired.
  # This job collapses them into one name that survives a matrix edit.
  #
  # `if: always()` is load-bearing. Without it a failing need skips this job, a skipped job
  # reports no conclusion, and the ruleset waits instead of failing: the pull request is
  # blocked by a check that is neither green nor red. The assertions compare against
  # `success` rather than `!= failure` for the same reason — a skipped or cancelled need
  # also reports non-success.
  gate:
    name: CI gate
    if: always()
    needs: [test, test-plugins, publish-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Every build, test, lint and package leg succeeded
        env:
          TEST: ${{ needs.test.result }}
          TEST_PLUGINS: ${{ needs.test-plugins.result }}
          PUBLISH_DRY_RUN: ${{ needs.publish-dry-run.result }}
        run: |
          set -eu
          printf 'test=%s test-plugins=%s publish-dry-run=%s\n' \
            "$TEST" "$TEST_PLUGINS" "$PUBLISH_DRY_RUN"
          test "$TEST" = success
          test "$TEST_PLUGINS" = success
          test "$PUBLISH_DRY_RUN" = success
