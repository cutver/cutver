name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run exists so a leg that GitHub queued and never served can be retried without an
  # empty commit. `gh run rerun --failed` re-queues into the *same* run, whose macOS slot is
  # already gone; `gh workflow run ci.yml --ref <branch>` starts a fresh run on the same head SHA,
  # which is the SHA the ruleset matches against `CI gate`.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs WITHOUT `--features plugins` on purpose: this job is the Pillar VI.4
  # guard that the lean build (no Extism, no WASM dependency tree) keeps
  # compiling, linting and passing. Keep that guard on every OS — the plugins
  # steps below are additive, on the macOS entry only, never a replacement for
  # the lean build. Since the ~4 MB budget was dropped, VI.4 is also asserted
  # rather than only compiled: the `Lean dependency shape` step below reads the
  # resolved graph.
  test:
    name: Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Both configurations, one runner. Hosted macOS arm64 capacity is the scarce resource
          # here: with a macOS leg in this job *and* one in `test-plugins`, a single run asks for
          # two macOS runners, and GitHub served only one of them — the other sat queued, was
          # never acquired (`runner_id: 0`, no steps), and was reaped at 15m02s with the
          # annotation `The job was not acquired by Runner of type hosted even after multiple
          # attempts`. That happened on three consecutive runs on 2026-11-18, twice under
          # `rerun --failed` and once on a fresh run. Folding halves the demand and loses no
          # coverage: the lean build on macOS is the VI.4 guard above, and the plugins feature is
          # platform-sensitive on its own (the plugin cache resolves $HOME).
          - label: macos-latest, default and plugins
            os: macos-latest
            target: aarch64-apple-darwin
            plugins: true
          - label: windows-latest
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo tree` needs a cargo invocation that must not nest inside `cargo test`, which is why
      # this check lives here and in scripts/check.sh instead of in tests/. Everything else about the
      # invariant is arithmetic over Cargo.toml and does live in tests/lean_dependency_graph.rs.
      - name: Lean dependency shape
        if: matrix.os == 'ubuntu-latest'
        run: |
          graph=$(cargo tree --locked --no-default-features -e normal --prefix none)
          names=$(printf '%s\n' "$graph" | awk '{print $1}' | sort -u)
          if printf '%s\n' "$names" | grep -qE '^(extism|wasmtime)'; then
            echo "::error::the lean build reaches a WebAssembly runtime; extism and wasmtime belong behind --features plugins"
            exit 1
          fi
          echo "lean dependency graph: $(printf '%s\n' "$names" | wc -l | tr -d ' ') crates, no WebAssembly runtime"
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      # `matrix.plugins` is absent on the other two entries, which evaluates to null, i.e. false.
      - name: Build (plugins feature)
        if: matrix.plugins
        run: cargo build --locked --workspace --all-targets --features plugins
      - name: Test (plugins feature)
        if: matrix.plugins
        run: cargo test --locked --workspace --features plugins
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      # CONTRACT.md:140 sets a hard ceiling of 200 lines per document; nothing
      # failed closed on it, so the entry point drifted past it. Runs here rather
      # than as its own job so the `gate` wiring keeps its exact three legs.
      - name: Documentation line budget
        if: matrix.os == 'ubuntu-latest'
        run: |
          status=0
          # CONTRACT.md is exempt by name and the exemption lives in the test that mirrors this loop,
          # so it reads as a decision instead of as an omission from this glob.
          for file in README.md CONTRIBUTING.md $(find docs -type f -name '*.md' | sort); do
            lines=$(wc -l < "$file" | tr -d ' ')
            if [ "$lines" -gt 200 ]; then
              echo "::error file=$file::$file has $lines lines; the ceiling is 200 (CONTRACT.md:140)"
              status=1
            fi
          done
          exit $status

  # Covers the `plugins` feature: Extism, the WASM driver, and the seven
  # `#[cfg(feature = "plugins")]` sites under src/. Without this job the whole
  # WebAssembly path is never compiled, including tests/wasm_plugin.rs, which is
  # gated behind `#![cfg(feature = "plugins")]`.
  #
  # The feature is platform-sensitive: the plugin cache resolves $HOME, which is
  # normally unset on Windows. Coverage therefore stays on all three OSes, but
  # macOS is covered by the folded entry in `test` rather than by a second macOS
  # runner requested here. Keep it that way while hosted macOS capacity is the
  # constraint: two macOS legs per run is what starved.
  #
  # No `target` matrix key here: the job above declares one that no step
  # consumes, and these runners already are the declared triples.
  test-plugins:
    name: Test with plugins feature (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: plugins-feature
      - name: Build
        run: cargo build --locked --workspace --all-targets --features plugins
      - name: Test
        run: cargo test --locked --workspace --features plugins
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --workspace --all-targets --features plugins -- -D warnings

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked

  # The single status check the `main` ruleset requires. Requiring the eight per-matrix
  # names directly would bind branch protection to the matrix: delete a leg and its check
  # stays expected forever, blocking every merge; add one and it is silently unrequired.
  # This job collapses them into one name that survives a matrix edit.
  #
  # `if: always()` is load-bearing. Without it a failing need skips this job, a skipped job
  # reports no conclusion, and the ruleset waits instead of failing: the pull request is
  # blocked by a check that is neither green nor red. The assertions compare against
  # `success` rather than `!= failure` for the same reason — a skipped or cancelled need
  # also reports non-success.
  gate:
    name: CI gate
    if: always()
    needs: [test, test-plugins, publish-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Every build, test, lint and package leg succeeded
        env:
          TEST: ${{ needs.test.result }}
          TEST_PLUGINS: ${{ needs.test-plugins.result }}
          PUBLISH_DRY_RUN: ${{ needs.publish-dry-run.result }}
        run: |
          set -eu
          printf 'test=%s test-plugins=%s publish-dry-run=%s\n' \
            "$TEST" "$TEST_PLUGINS" "$PUBLISH_DRY_RUN"
          test "$TEST" = success
          test "$TEST_PLUGINS" = success
          test "$PUBLISH_DRY_RUN" = success
