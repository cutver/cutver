# Throwaway verification workflow for issue #175 (see
# odd/tasks/plugins-feature-musl-verification.md). It builds the `plugins`
# feature for both musl targets and the `rust:alpine` builder stage, then
# executes the resulting artifacts.
#
# `push` and NOT `workflow_dispatch`: a dispatch workflow only becomes callable
# once it exists on the default branch, and this file lives only on the
# temporary branch `chore/plugins-musl-verify`. This is the same pattern used
# for the runner-label proof in #174.
#
# Delete this file and the temporary branch once the run's evidence has been
# recorded in odd/tasks/plugins-feature-musl-verification.md (D6). No permanent
# per-push CI job is added until the measured cost is known (D5).

name: Plugins musl verification (throwaway)

on:
  push:
    branches:
      - chore/plugins-musl-verify

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  musl-x86_64:
    name: musl x86_64 build + execute + wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: plugins-musl-x86_64

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Determine expected version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build (x86_64-unknown-linux-musl, --features plugins)
        run: cargo build --locked --release --features plugins --target x86_64-unknown-linux-musl

      - name: Execute artifact (release smoke, acceptance item 4)
        run: sh .github/scripts/release-smoke/run.sh target/x86_64-unknown-linux-musl/release/cutver "${{ steps.version.outputs.version }}"

      - name: Wasm load check (tests/wasm_plugin.rs, acceptance item 4)
        run: cargo test --locked --features plugins --target x86_64-unknown-linux-musl --test wasm_plugin

      - name: Summary
        if: always()
        run: |
          echo "cutver-verify musl-x86_64 (x86_64-unknown-linux-musl): ${{ job.status }}"

  musl-aarch64:
    name: musl aarch64 build (cross) + execute (qemu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: plugins-musl-aarch64

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Install qemu user emulation
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Determine expected version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build (aarch64-unknown-linux-musl, --features plugins, cross)
        run: cross build --locked --release --features plugins --target aarch64-unknown-linux-musl

      # run.sh executes its argument directly. To route a foreign-arch binary
      # through the emulator we generate a tiny wrapper script and hand its
      # path to run.sh; the wrapper execs qemu-aarch64-static on the real static
      # binary. The path embedded in the wrapper must be absolute because
      # run.sh cds into its fixture before invoking the binary.
      - name: Execute artifact under qemu-aarch64-static (acceptance item 4)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BIN="$PWD/target/aarch64-unknown-linux-musl/release/cutver"
          file "$BIN"
          qemu-aarch64-static "$BIN" --version
          mkdir -p .qemu-wrap
          cat > .qemu-wrap/cutver <<EOF
          #!/bin/sh
          exec qemu-aarch64-static "$BIN" "\$@"
          EOF
          chmod +x .qemu-wrap/cutver
          sh .github/scripts/release-smoke/run.sh .qemu-wrap/cutver "$VERSION"

      # The wasm load check is NOT repeated here: cross's qemu test mechanics are an
      # infrastructure concern of their own, and the x86_64 job already runs
      # tests/wasm_plugin.rs natively on a musl target. This job's contract is the
      # cross build plus executing the resulting artifact under qemu.
      - name: Summary
        if: always()
        run: |
          echo "cutver-verify musl-aarch64 (aarch64-unknown-linux-musl): ${{ job.status }}"

  # The full image build compiles the same builder stage this issue asks about
  # (acceptance item 3), so one job proves both that the stage compiles with the
  # feature and that the resulting plugin-enabled binary boots and runs the real
  # release logic in the minimal `alpine:3.24` runtime image (acceptance item 4).
  # The full Extism execute path is covered by the musl-x86_64 job
  # (tests/wasm_plugin.rs); this image ships no Rust toolchain, so it cannot rerun
  # that suite.
  alpine:
    name: Alpine image with plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine expected version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the image with the plugins feature (acceptance item 3)
        run: docker build -f Containerfile --build-arg CUTVER_FEATURES="--features plugins" -t cutver-plugins .

      - name: Execute artifact inside the image (acceptance item 4)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo:ro" \
            --entrypoint /bin/sh \
            cutver-plugins /repo/.github/scripts/release-smoke/run.sh /usr/local/bin/cutver "${{ steps.version.outputs.version }}"

      - name: Summary
        if: always()
        run: |
          echo "cutver-verify alpine (alpine:3.24 plugin-enabled image): ${{ job.status }}"
