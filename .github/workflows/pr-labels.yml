name: PR labels

# `opened` is required, not optional. This check is a required status on `main`, and a
# required check that never reports leaves a pull request stuck in "Expected" forever:
# unmergeable, with nothing red to explain why. A new PR is therefore red until it gets a
# type label — a state a reviewer can see, unlike a check that silently never arrives. A
# label applied in the same `gh pr create` rides inside the `opened` payload, so the common
# case is green on the first run.
on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  type-label:
    name: Exactly one type label
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one type:* label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -eu
          valid="type:feat, type:fix, type:docs, type:refactor, type:perf, type:test, type:build, type:ci, type:chore, type:style, type:revert"
          valid_labels="type:feat type:fix type:docs type:refactor type:perf type:test type:build type:ci type:chore type:style type:revert"
          type_labels=$(printf '%s' "$LABELS" | jq -r '.[].name | select(startswith("type:"))')

          count=0
          if [ -n "$type_labels" ]; then
            while IFS= read -r label; do
              [ -z "$label" ] && continue
              count=$((count + 1))
              case " $valid_labels " in
                *" $label "*) ;;
                *)
                  printf "Unknown type label '%s'.\n" "$label" >&2
                  printf 'Available: %s.\n' "$valid" >&2
                  exit 1
                  ;;
              esac
            done <<< "$type_labels"
          fi

          if [ "$count" -eq 1 ]; then
            printf 'One valid type label present: %s\n' "$type_labels"
            exit 0
          fi

          printf 'This pull request must carry exactly one type:* label; found %s.\n' "$count" >&2
          printf 'Available: %s.\n' "$valid" >&2
          exit 1
