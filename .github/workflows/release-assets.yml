name: Release Assets (Backfill)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to build and publish assets for (e.g. v0.11.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            slug: linux-musl-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            slug: linux-musl-arm64
            archive: tar.gz
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            slug: macos-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            slug: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            slug: windows-arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install aarch64 gcc compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Build
        if: matrix.use_cross != true
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          OUT="cutver-${VERSION}-${{ matrix.slug }}"
          mkdir "$OUT"
          cp target/${{ matrix.target }}/release/cutver "$OUT/"
          tar -czf "${OUT}.tar.gz" "$OUT"
          mkdir -p dist
          mv "${OUT}.tar.gz" dist/

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $version = $tag.Substring(1)
          $out = "cutver-$version-${{ matrix.slug }}"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cutver.exe" "$out/"
          Compress-Archive -Path $out -DestinationPath "$out.zip"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Move-Item "$out.zip" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: asset-${{ matrix.slug }}
          path: dist/*

  publish:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download all asset artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          awk -v h="## [${TAG}]" 'BEGIN{p=0} $0 ~ "^"h {p=1; next} p && /^## /{exit} p {print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::Failed to extract release notes for ${TAG} from CHANGELOG.md"
            exit 1
          fi

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum cutver-* > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS with Cosign
        run: |
          cosign sign-blob \
            --yes \
            --bundle dist/SHA256SUMS.bundle \
            dist/SHA256SUMS

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
