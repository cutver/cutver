name: Cutver CLI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump level"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Simulate the release without publishing or creating a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check & Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.cutver.outputs.tag }}
      released: ${{ steps.cutver.outputs.released }}
      version: ${{ steps.cutver.outputs.version }}
      commit: ${{ steps.cutver.outputs.commit }}
      # The render step owns this path, so the value is a constant: the action output that used to
      # carry it went away with the action.
      notes: RELEASE_NOTES.md
    steps:
      # This job bumps and pushes the branch; it publishes nothing irreversible. The tag, the crate
      # and the draft release are created by the `publish` job below, which runs only once `build`,
      # `build-plugins`, `smoke` and `smoke-plugins` are green: a run whose smoke fails leaves no tag
      # to delete, no crate version burned and no draft to clean up (#259). That is why the bump step
      # defers — `cutver bump --defer-publish` stops after the branch push and reports what it left
      # for the closing job in .cutver-release.json.
      #
      # The `main` ruleset requires `CI gate`, and the bump commit is created inside this job, so no
      # check run can exist for it when `cutver bump` pushes: the push must therefore authenticate
      # as the release app, the ruleset's only bypass actor. The app token is therefore mandatory, not
      # opportunistic: the checkout below persists exactly that token, and a missing one now fails
      # this job at the step that mints it, before anything is written, instead of degrading into a
      # github-actions[bot] push the ruleset rejects after the fact. The `publish` job mints the same
      # app token for the same reason: the tag push it performs reaches the same ruleset.
      #
      # The github-publish plugin creates the release, so the token it authenticates with decides
      # who the release is attributed to. The bump commit is authored as cutver-release[bot] by the
      # `git config` step below; secrets.GITHUB_TOKEN would create the release itself as
      # github-actions[bot], which is the attribution issue #166 exists to remove.
      - name: Generate release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CUTVER_APP_ID }}
          private-key: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
        env:
          CUTVER_APP_ID: ${{ secrets.CUTVER_APP_ID }}
          CUTVER_APP_PRIVATE_KEY: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}

      - name: Require the release bot token
        run: |
          if [ -z "${{ steps.release-token.outputs.token }}" ]; then
            echo "::error::the cutver-release app token is missing. The main ruleset only lets that app push, so the release cannot proceed: fix CUTVER_APP_ID / CUTVER_APP_PRIVATE_KEY and the app's contents:write permission on ${{ github.repository }}."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup Git bot credentials
        run: |
          git config --global user.name "cutver-release[bot]"
          git config --global user.email "${{ secrets.CUTVER_APP_ID || 'github-actions' }}+cutver-release[bot]@users.noreply.github.com"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The release is cut by the CLI built from THIS commit, never by the previously published
      # binary. `cutver/setup` resolves `version: latest`, so a fix in the sandbox or in the
      # release path could only ship in a release it was unable to cut: #251 blocked 0.18.0
      # exactly that way, and the plugin pin had to be rolled back to work around it.
      - name: Cache the release-profile build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-cli

      - name: Build the CLI from this commit
        run: cargo build --locked --release --features plugins

      # Every `cutver` step below resolves the binary through PATH, so the build above is the one
      # that runs. The plugin-enabled variant is required: a lean build fails closed on the
      # [plugins.github-publish] declaration.
      - name: Put the built CLI first on PATH
        run: echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      # Single source of truth: `source` and `hash` live in cutver.toml, the command writes into the
      # cache root the host resolves from $HOME, and it verifies the digest before accepting the
      # file. Resolving the URL goes through the Cutver registry, so a plugin version must be
      # indexed there before a release that pins it.
      - name: Restore the declared plugin artifacts
        run: cutver plugin restore

      - name: Doctor
        run: cutver doctor --check-changelog

      # `--defer-publish` is what keeps this job harmless: the bump commit and its branch push are
      # the only writes it performs. The tag, the registry and the release wait for `publish`.
      - name: Release (bump only)
        id: release
        run: |
          args=(--defer-publish --report .cutver-release.json)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          cutver bump "${{ inputs.bump || 'auto' }}" "${args[@]}"
        env:
          # Declared in permissions.env, so these are the only environment keys the plugin sees.
          # The app token is what makes the release attributed to cutver-release[bot].
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # The machine-readable result of the bump, and the only source the other jobs read. A
      # `--dry-run` reports `released=false`, so every downstream job stays skipped; a real run
      # reports the commit they check out instead of a tag that does not exist yet.
      - name: Read the release report
        id: cutver
        run: |
          report=.cutver-release.json
          if [ ! -f "$report" ]; then
            echo "::error::cutver bump wrote no release report; nothing was published."
            exit 1
          fi
          for key in released deferred version tag commit; do
            value=$(jq -r --arg k "$key" '.[$k] // "" | tostring' "$report")
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Render the release notes
        if: steps.cutver.outputs.released == 'true'
        run: cutver changelog latest --template .github/templates/cutver/RELEASE.md > RELEASE_NOTES.md

      - name: Save Release Notes Artifact
        if: steps.cutver.outputs.released == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            slug: linux-musl-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            slug: linux-musl-arm64
            archive: tar.gz
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            slug: macos-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            slug: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            slug: windows-arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      # The tag does not exist while these jobs run: the release commit is the only ref there is.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install aarch64 gcc compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Build
        if: matrix.use_cross != true
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          OUT="cutver-${VERSION}-${{ matrix.slug }}"
          mkdir "$OUT"
          cp target/${{ matrix.target }}/release/cutver "$OUT/"
          tar -czf "${OUT}.tar.gz" "$OUT"
          mkdir -p dist
          mv "${OUT}.tar.gz" dist/

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ needs.version.outputs.tag }}"
          $version = $tag.Substring(1)
          $out = "cutver-$version-${{ matrix.slug }}"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cutver.exe" "$out/"
          Compress-Archive -Path $out -DestinationPath "$out.zip"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Move-Item "$out.zip" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: asset-${{ matrix.slug }}
          path: dist/*

  build-plugins:
    name: Build plugins ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            slug: linux-musl-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            slug: linux-musl-arm64
            archive: tar.gz
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            slug: macos-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            slug: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            slug: windows-arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      # The tag does not exist while these jobs run: the release commit is the only ref there is.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install aarch64 gcc compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --locked --release --features plugins --target ${{ matrix.target }}

      - name: Build
        if: matrix.use_cross != true
        run: cargo build --locked --release --features plugins --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          OUT="cutver-plugins-${VERSION}-${{ matrix.slug }}"
          mkdir "$OUT"
          cp target/${{ matrix.target }}/release/cutver "$OUT/"
          tar -czf "${OUT}.tar.gz" "$OUT"
          mkdir -p dist
          mv "${OUT}.tar.gz" dist/

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ needs.version.outputs.tag }}"
          $version = $tag.Substring(1)
          $out = "cutver-plugins-$version-${{ matrix.slug }}"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cutver.exe" "$out/"
          Compress-Archive -Path $out -DestinationPath "$out.zip"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Move-Item "$out.zip" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: asset-plugins-${{ matrix.slug }}
          path: dist/*

  smoke:
    name: Smoke ${{ matrix.slug }}
    needs: [version, build]
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x86_64
            runner: ubuntu-latest
            archive: tar.gz
          - slug: linux-musl-x86_64
            runner: ubuntu-latest
            archive: tar.gz
          - slug: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - slug: linux-musl-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - slug: macos-x86_64
            runner: macos-15-intel
            archive: tar.gz
          - slug: macos-arm64
            runner: macos-latest
            archive: tar.gz
          - slug: windows-x86_64
            runner: windows-latest
            archive: zip
          - slug: windows-arm64
            runner: windows-11-arm
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Download asset artifact
        uses: actions/download-artifact@v5
        with:
          name: asset-${{ matrix.slug }}
          path: dist

      - name: Extract archive (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extract
          tar -xzf dist/*.tar.gz -C extract

      - name: Extract archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path extract -Force | Out-Null
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath extract -Force
          }

      - name: Run release smoke
        shell: bash
        run: |
          set -euo pipefail
          set -- extract/cutver-*/cutver
          if [ ! -f "$1" ]; then
            set -- extract/cutver-*/cutver.exe
          fi
          if [ ! -f "$1" ]; then
            echo "::error::could not locate cutver binary in the extracted artifact"
            exit 1
          fi
          sh .github/scripts/release-smoke/run.sh "$1" "${{ needs.version.outputs.version }}"

  smoke-plugins:
    name: Smoke plugins ${{ matrix.slug }}
    needs: [version, build-plugins]
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x86_64
            runner: ubuntu-latest
            archive: tar.gz
          - slug: linux-musl-x86_64
            runner: ubuntu-latest
            archive: tar.gz
          - slug: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - slug: linux-musl-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - slug: macos-x86_64
            runner: macos-15-intel
            archive: tar.gz
          - slug: macos-arm64
            runner: macos-latest
            archive: tar.gz
          - slug: windows-x86_64
            runner: windows-latest
            archive: zip
          - slug: windows-arm64
            runner: windows-11-arm
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Download asset artifact
        uses: actions/download-artifact@v5
        with:
          name: asset-plugins-${{ matrix.slug }}
          path: dist

      - name: Extract archive (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extract
          tar -xzf dist/*.tar.gz -C extract

      - name: Extract archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path extract -Force | Out-Null
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath extract -Force
          }

      - name: Run plugins release smoke
        shell: bash
        run: |
          set -euo pipefail
          set -- extract/cutver-plugins-*/cutver
          if [ ! -f "$1" ]; then
            set -- extract/cutver-plugins-*/cutver.exe
          fi
          if [ ! -f "$1" ]; then
            echo "::error::could not locate cutver binary in the extracted plugins artifact"
            exit 1
          fi
          sh .github/scripts/release-smoke/run-plugins.sh "$1" "${{ needs.version.outputs.version }}"

  publish:
    name: Upload release assets
    needs: [version, build, build-plugins, smoke, smoke-plugins]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # This job is the only place the release is published, and `cutver publish` is what makes it
      # irreversible: it creates the tag, pushes it, moves the floating major tag, runs
      # `[publish].commands` (cargo publish) and dispatches `on_post_release`, which creates the
      # draft release. It therefore runs only after build, build-plugins, smoke and smoke-plugins
      # are green, and it authenticates as the release app for the same ruleset reason as the
      # version job: the tag push reaches `main`, which only that app may bypass. The token is
      # mandatory here too — a fallback would only move the rejection to the push, after the tag
      # has already landed.
      - name: Generate release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CUTVER_APP_ID }}
          private-key: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
        env:
          CUTVER_APP_ID: ${{ secrets.CUTVER_APP_ID }}
          CUTVER_APP_PRIVATE_KEY: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}

      - name: Require the release bot token
        run: |
          if [ -z "${{ steps.release-token.outputs.token }}" ]; then
            echo "::error::the cutver-release app token is missing. The main ruleset only lets that app push, so the release cannot be published: fix CUTVER_APP_ID / CUTVER_APP_PRIVATE_KEY and the app's contents:write permission on ${{ github.repository }}."
            exit 1
          fi

      # The release commit, not the tag: the tag is created by the step at the bottom of this job.
      # `fetch-depth: 0` gives `cutver publish` the history it resolves HEAD against, and the token
      # is the app's, because the tag push must bypass the ruleset.
      - name: Checkout the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      # Same rationale as the version job: the CLI that publishes is the one built from this
      # commit, never the previously published binary. The plugin-enabled variant is required, or
      # the closing phase fails closed on the [plugins.github-publish] declaration.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the release-profile build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-cli

      - name: Build the CLI from the release commit
        run: cargo build --locked --release --features plugins

      - name: Put the built CLI first on PATH
        run: echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      - name: Restore the declared plugin artifacts
        run: cutver plugin restore

      - name: Download the rendered release notes
        uses: actions/download-artifact@v5
        with:
          name: release-notes

      - name: Publish the release
        id: publish
        run: cutver publish --tag "${{ needs.version.outputs.tag }}" --commit "${{ needs.version.outputs.commit }}" --notes-file RELEASE_NOTES.md
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Declared in permissions.env, so these are the only environment keys the plugin sees.
          # The app token is what makes the release attributed to cutver-release[bot].
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Download all asset artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum cutver-* > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS with Cosign
        run: |
          cosign sign-blob \
            --yes \
            --bundle dist/SHA256SUMS.bundle \
            dist/SHA256SUMS

      - name: Upload binaries into the draft release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # The github-publish plugin created this release as a draft when `cutver publish` ran
          # `on_post_release` above, so it must already exist. Only a missing release is an error:
          # creating a second release here would race the plugin. An already-published release is a
          # legitimate retry, so it falls through to the upload. The failure carries gh's own
          # message, so an auth problem is never reported as a missing release.
          if state=$(gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>&1); then
            case "$state" in
              draft|published) echo "release $TAG is $state; uploading assets" ;;
              *)
                echo "::error::Unexpected release state for $TAG: '$state'."
                exit 1
                ;;
            esac
          else
            echo "::error::Could not read the release for $TAG: $state"
            echo "::error::If it does not exist, the github-publish plugin never created its draft: check that `cutver publish` ran on the plugin-enabled build and that on_post_release succeeded."
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: Promote the draft release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end')
          case "$state" in
            published)
              # A retry after a successful run: the Homebrew and Scoop steps below must still be
              # able to run, so publishing again is a no-op rather than a failure.
              echo "release $TAG is already published; nothing to promote"
              exit 0
              ;;
            draft) ;;
            *)
              echo "::error::Refusing to promote $TAG: expected a draft, got '$state'."
              exit 1
              ;;
          esac
          # Every artefact exists by now: the platform archives, SHA256SUMS and the cosign bundle.
          # A failed build never reaches this step, so a draft cannot become public without them.
          #
          # Neither the title nor the body is repeated here: the plugin created the draft from the
          # entry Cutver rendered (fed by `--notes-file` on `cutver publish`) and the title
          # `title_template` asked for. Passing either again gave the release a second owner — that
          # is how `title_template` once came out dead.
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json isDraft,tagName --jq 'if .isDraft then error("release is still a draft after publishing") else "published \(.tagName)" end'

      - name: Generate distribution bot token
        id: bot-token
        if: env.CUTVER_APP_ID != '' && env.CUTVER_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CUTVER_APP_ID }}
          private-key: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}
          owner: Row0902
        env:
          CUTVER_APP_ID: ${{ secrets.CUTVER_APP_ID }}
          CUTVER_APP_PRIVATE_KEY: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}

      - name: Update Homebrew tap formula
        if: steps.bot-token.outputs.token != '' || env.HOMEBREW_TAP_TOKEN != ''
        env:
          DIST_TOKEN: ${{ steps.bot-token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"

          # Extract SHA-256 hashes generated in dist/SHA256SUMS
          SHA_MACOS_ARM=$(grep "cutver-${VERSION}-macos-arm64.tar.gz" dist/SHA256SUMS | awk '{print $1}')
          SHA_MACOS_INTEL=$(grep "cutver-${VERSION}-macos-x86_64.tar.gz" dist/SHA256SUMS | awk '{print $1}')
          SHA_LINUX_INTEL=$(grep "cutver-${VERSION}-linux-musl-x86_64.tar.gz" dist/SHA256SUMS | awk '{print $1}')
          SHA_LINUX_ARM=$(grep "cutver-${VERSION}-linux-musl-arm64.tar.gz" dist/SHA256SUMS | awk '{print $1}')

          if [ -z "$SHA_MACOS_ARM" ] || [ -z "$SHA_MACOS_INTEL" ] || [ -z "$SHA_LINUX_INTEL" ] || [ -z "$SHA_LINUX_ARM" ]; then
            echo "::error::Failed to resolve all required SHA-256 sums for Homebrew formula"
            exit 1
          fi

          git clone "https://x-access-token:${DIST_TOKEN}@github.com/Row0902/homebrew-tap.git" tap
          cd tap

          cat <<EOF > Formula/cutver.rb
          class Cutver < Formula
            desc "Cut a release. Bump SemVer. Every project, every language"
            homepage "https://github.com/cutver/cutver"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-macos-arm64.tar.gz"
                sha256 "${SHA_MACOS_ARM}"
              end
              on_intel do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-macos-x86_64.tar.gz"
                sha256 "${SHA_MACOS_INTEL}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-linux-musl-x86_64.tar.gz"
                sha256 "${SHA_LINUX_INTEL}"
              end
              on_arm do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-linux-musl-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end
            end

            conflicts_with "cutver-plugins", because: "both install the cutver binary"

            def install
              bin.install "cutver"
            end

            test do
              assert_match "cutver #{version}", shell_output("#{bin}/cutver --version")
            end
          end
          EOF

          sed -i 's/^          //' Formula/cutver.rb

          git config user.name "cutver-release[bot]"
          git config user.email "${{ secrets.CUTVER_APP_ID }}+cutver-release[bot]@users.noreply.github.com"
          git add Formula/cutver.rb

          if git diff --staged --quiet; then
            echo "Homebrew tap formula is already up to date with ${TAG}."
          else
            git commit -m "feat(cutver): bump cutver to ${TAG}"
            git push origin main
            echo "Successfully updated Formula/cutver.rb to ${TAG} in Row0902/homebrew-tap."
          fi

      - name: Update Homebrew tap plugin formula
        if: steps.bot-token.outputs.token != '' || env.HOMEBREW_TAP_TOKEN != ''
        env:
          DIST_TOKEN: ${{ steps.bot-token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"

          # Extract the plugin-enabled SHA-256 hashes generated in dist/SHA256SUMS
          SHA_PLUGIN_MACOS_ARM=$(grep "cutver-plugins-${VERSION}-macos-arm64.tar.gz" dist/SHA256SUMS | awk '{print $1}')
          SHA_PLUGIN_MACOS_INTEL=$(grep "cutver-plugins-${VERSION}-macos-x86_64.tar.gz" dist/SHA256SUMS | awk '{print $1}')
          SHA_PLUGIN_LINUX_INTEL=$(grep "cutver-plugins-${VERSION}-linux-musl-x86_64.tar.gz" dist/SHA256SUMS | awk '{print $1}')
          SHA_PLUGIN_LINUX_ARM=$(grep "cutver-plugins-${VERSION}-linux-musl-arm64.tar.gz" dist/SHA256SUMS | awk '{print $1}')

          if [ -z "$SHA_PLUGIN_MACOS_ARM" ] || [ -z "$SHA_PLUGIN_MACOS_INTEL" ] || [ -z "$SHA_PLUGIN_LINUX_INTEL" ] || [ -z "$SHA_PLUGIN_LINUX_ARM" ]; then
            echo "::error::Failed to resolve all required SHA-256 sums for the Homebrew plugin formula"
            exit 1
          fi

          git clone "https://x-access-token:${DIST_TOKEN}@github.com/Row0902/homebrew-tap.git" tap-plugins
          cd tap-plugins

          cat <<EOF > Formula/cutver-plugins.rb
          class CutverPlugins < Formula
            desc "Cut a release. Bump SemVer. Every project, every language (plugin-enabled build)"
            homepage "https://github.com/cutver/cutver"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-plugins-${VERSION}-macos-arm64.tar.gz"
                sha256 "${SHA_PLUGIN_MACOS_ARM}"
              end
              on_intel do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-plugins-${VERSION}-macos-x86_64.tar.gz"
                sha256 "${SHA_PLUGIN_MACOS_INTEL}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-plugins-${VERSION}-linux-musl-x86_64.tar.gz"
                sha256 "${SHA_PLUGIN_LINUX_INTEL}"
              end
              on_arm do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-plugins-${VERSION}-linux-musl-arm64.tar.gz"
                sha256 "${SHA_PLUGIN_LINUX_ARM}"
              end
            end

            conflicts_with "cutver", because: "both install the cutver binary"

            def install
              bin.install "cutver"
            end

            test do
              assert_match "cutver #{version}", shell_output("#{bin}/cutver --version")
              assert_match "plugin", shell_output("#{bin}/cutver plugin --help")
            end
          end
          EOF

          sed -i 's/^          //' Formula/cutver-plugins.rb

          git config user.name "cutver-release[bot]"
          git config user.email "${{ secrets.CUTVER_APP_ID }}+cutver-release[bot]@users.noreply.github.com"
          git add Formula/cutver-plugins.rb

          if git diff --staged --quiet; then
            echo "Homebrew tap plugin formula is already up to date with ${TAG}."
          else
            git commit -m "feat(cutver-plugins): add plugin-enabled cutver ${TAG}"
            git push origin main
            echo "Successfully updated Formula/cutver-plugins.rb to ${TAG} in Row0902/homebrew-tap."
          fi

      - name: Update Scoop bucket manifest
        if: steps.bot-token.outputs.token != '' || env.HOMEBREW_TAP_TOKEN != ''
        env:
          DIST_TOKEN: ${{ steps.bot-token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"

          # Extract Windows SHA-256 hashes generated in dist/SHA256SUMS
          SHA_WIN_X64=$(grep "cutver-${VERSION}-windows-x86_64.zip" dist/SHA256SUMS | awk '{print $1}')
          SHA_WIN_ARM=$(grep "cutver-${VERSION}-windows-arm64.zip" dist/SHA256SUMS | awk '{print $1}')

          if [ -z "$SHA_WIN_X64" ] || [ -z "$SHA_WIN_ARM" ]; then
            echo "::error::Failed to resolve all required Windows SHA-256 sums for Scoop manifest"
            exit 1
          fi

          git clone "https://x-access-token:${DIST_TOKEN}@github.com/Row0902/scoop-bucket.git" scoop
          cd scoop

          python3 -c "
          import json

          with open('bucket/cutver.json', 'r') as f:
              data = json.load(f)

          data['version'] = '${VERSION}'
          data['architecture'] = {
              '64bit': {
                  'url': 'https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-windows-x86_64.zip',
                  'hash': '${SHA_WIN_X64}',
                  'extract_dir': 'cutver-${VERSION}-windows-x86_64'
              },
              'arm64': {
                  'url': 'https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-windows-arm64.zip',
                  'hash': '${SHA_WIN_ARM}',
                  'extract_dir': 'cutver-${VERSION}-windows-arm64'
              }
          }
          data['autoupdate']['architecture'] = {
              '64bit': {
                  'url': 'https://github.com/cutver/cutver/releases/download/v\$version/cutver-\$version-windows-x86_64.zip',
                  'extract_dir': 'cutver-\$version-windows-x86_64'
              },
              'arm64': {
                  'url': 'https://github.com/cutver/cutver/releases/download/v\$version/cutver-\$version-windows-arm64.zip',
                  'extract_dir': 'cutver-\$version-windows-arm64'
              }
          }

          with open('bucket/cutver.json', 'w') as f:
              json.dump(data, f, indent=4)
              f.write('\n')
          "

          git config user.name "cutver-release[bot]"
          git config user.email "${{ secrets.CUTVER_APP_ID }}+cutver-release[bot]@users.noreply.github.com"
          git add bucket/cutver.json

          if git diff --staged --quiet; then
            echo "Scoop bucket manifest is already up to date with ${TAG}."
          else
            git commit -m "cutver: Update to version ${VERSION}"
            git push origin master
            echo "Successfully updated bucket/cutver.json to ${VERSION} in Row0902/scoop-bucket."
          fi

      - name: Generate Scoop bucket plugin manifest
        if: steps.bot-token.outputs.token != '' || env.HOMEBREW_TAP_TOKEN != ''
        env:
          DIST_TOKEN: ${{ steps.bot-token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"

          # Extract the plugin-enabled Windows SHA-256 hashes generated in dist/SHA256SUMS
          SHA_PLUGIN_WIN_X64=$(grep "cutver-plugins-${VERSION}-windows-x86_64.zip" dist/SHA256SUMS | awk '{print $1}')
          SHA_PLUGIN_WIN_ARM=$(grep "cutver-plugins-${VERSION}-windows-arm64.zip" dist/SHA256SUMS | awk '{print $1}')

          if [ -z "$SHA_PLUGIN_WIN_X64" ] || [ -z "$SHA_PLUGIN_WIN_ARM" ]; then
            echo "::error::Failed to resolve all required Windows SHA-256 sums for the Scoop plugin manifest"
            exit 1
          fi

          git clone "https://x-access-token:${DIST_TOKEN}@github.com/Row0902/scoop-bucket.git" scoop-plugins
          cd scoop-plugins

          python3 -c "
          import json

          data = {
              'version': '${VERSION}',
              'description': 'Cut a release. Bump SemVer. Every project, every language. (Plugin-enabled build)',
              'homepage': 'https://github.com/cutver/cutver',
              'license': 'MIT',
              'notes': 'Plugin-enabled build. Install either this or cutver, not both. If both were installed, run: scoop reset cutver-plugins',
              'architecture': {
                  '64bit': {
                      'url': 'https://github.com/cutver/cutver/releases/download/${TAG}/cutver-plugins-${VERSION}-windows-x86_64.zip',
                      'hash': '${SHA_PLUGIN_WIN_X64}',
                      'extract_dir': 'cutver-plugins-${VERSION}-windows-x86_64'
                  },
                  'arm64': {
                      'url': 'https://github.com/cutver/cutver/releases/download/${TAG}/cutver-plugins-${VERSION}-windows-arm64.zip',
                      'hash': '${SHA_PLUGIN_WIN_ARM}',
                      'extract_dir': 'cutver-plugins-${VERSION}-windows-arm64'
                  }
              },
              'bin': 'cutver.exe',
              'checkver': {
                  'github': 'https://github.com/cutver/cutver'
              },
              'autoupdate': {
                  'architecture': {
                      '64bit': {
                          'url': 'https://github.com/cutver/cutver/releases/download/v\$version/cutver-plugins-\$version-windows-x86_64.zip',
                          'extract_dir': 'cutver-plugins-\$version-windows-x86_64'
                      },
                      'arm64': {
                          'url': 'https://github.com/cutver/cutver/releases/download/v\$version/cutver-plugins-\$version-windows-arm64.zip',
                          'extract_dir': 'cutver-plugins-\$version-windows-arm64'
                      }
                  },
                  'hash': {
                      'url': 'https://github.com/cutver/cutver/releases/download/v\$version/SHA256SUMS'
                  }
              }
          }

          with open('bucket/cutver-plugins.json', 'w') as f:
              json.dump(data, f, indent=4)
              f.write('\n')
          "

          git config user.name "cutver-release[bot]"
          git config user.email "${{ secrets.CUTVER_APP_ID }}+cutver-release[bot]@users.noreply.github.com"
          git add bucket/cutver-plugins.json

          if git diff --staged --quiet; then
            echo "Scoop bucket plugin manifest is already up to date with ${TAG}."
          else
            git commit -m "cutver-plugins: add plugin-enabled cutver ${VERSION}"
            git push origin master
            echo "Successfully updated bucket/cutver-plugins.json to ${VERSION} in Row0902/scoop-bucket."
          fi

      - name: Smoke test fresh Cutver installation
        uses: cutver/setup@v1
        with:
          version: ${{ needs.version.outputs.tag }}
          cache: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installed binary
        run: cutver --version

