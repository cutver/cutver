name: Cutver CLI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump level"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check & Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.cutver.outputs.tag }}
      released: ${{ steps.cutver.outputs.released }}
      version: ${{ steps.cutver.outputs.version }}
      notes: ${{ steps.cutver.outputs.notes-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Git bot credentials
        run: |
          git config --global user.name "cutver-release[bot]"
          git config --global user.email "${{ secrets.CUTVER_APP_ID || 'github-actions' }}+cutver-release[bot]@users.noreply.github.com"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cutver CLI
        uses: cutver/setup@v1
        with:
          version: "latest"
          cache: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Cutver Release
        id: cutver
        uses: cutver/release@v1
        with:
          command: "release"
          bump: ${{ inputs.bump || 'auto' }}
          check-changelog: "true"
          notes-file: "RELEASE_NOTES.md"
          template: ".github/templates/cutver/RELEASE.md"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Save Release Notes Artifact
        if: steps.cutver.outputs.released == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            slug: linux-musl-x86_64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            slug: linux-musl-arm64
            archive: tar.gz
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            slug: macos-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            slug: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            slug: windows-arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install aarch64 gcc compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Build
        if: matrix.use_cross != true
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"
          OUT="cutver-${VERSION}-${{ matrix.slug }}"
          mkdir "$OUT"
          cp target/${{ matrix.target }}/release/cutver "$OUT/"
          tar -czf "${OUT}.tar.gz" "$OUT"
          mkdir -p dist
          mv "${OUT}.tar.gz" dist/

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ needs.version.outputs.tag }}"
          $version = $tag.Substring(1)
          $out = "cutver-$version-${{ matrix.slug }}"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cutver.exe" "$out/"
          Compress-Archive -Path $out -DestinationPath "$out.zip"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Move-Item "$out.zip" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: asset-${{ matrix.slug }}
          path: dist/*

  publish:
    name: Upload release assets
    needs: [version, build]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download all asset artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Download release notes artifact
        uses: actions/download-artifact@v5
        with:
          name: release-notes
          path: ./

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum cutver-* > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS with Cosign
        run: |
          cosign sign-blob \
            --yes \
            --bundle dist/SHA256SUMS.bundle \
            dist/SHA256SUMS

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate distribution bot token
        id: bot-token
        if: env.CUTVER_APP_ID != '' && env.CUTVER_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CUTVER_APP_ID }}
          private-key: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}
          owner: Row0902
        env:
          CUTVER_APP_ID: ${{ secrets.CUTVER_APP_ID }}
          CUTVER_APP_PRIVATE_KEY: ${{ secrets.CUTVER_APP_PRIVATE_KEY }}

      - name: Update Homebrew tap formula
        if: steps.bot-token.outputs.token != '' || env.HOMEBREW_TAP_TOKEN != ''
        env:
          DIST_TOKEN: ${{ steps.bot-token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"

          # Extract SHA-256 hashes generated in dist/SHA256SUMS
          SHA_MACOS_ARM=$(grep "cutver-${VERSION}-macos-arm64.tar.gz" dist/SHA256SUMS | awk '{print $1}')
          SHA_MACOS_INTEL=$(grep "cutver-${VERSION}-macos-x86_64.tar.gz" dist/SHA256SUMS | awk '{print $1}')
          SHA_LINUX_INTEL=$(grep "cutver-${VERSION}-linux-musl-x86_64.tar.gz" dist/SHA256SUMS | awk '{print $1}')
          SHA_LINUX_ARM=$(grep "cutver-${VERSION}-linux-musl-arm64.tar.gz" dist/SHA256SUMS | awk '{print $1}')

          if [ -z "$SHA_MACOS_ARM" ] || [ -z "$SHA_MACOS_INTEL" ] || [ -z "$SHA_LINUX_INTEL" ] || [ -z "$SHA_LINUX_ARM" ]; then
            echo "::error::Failed to resolve all required SHA-256 sums for Homebrew formula"
            exit 1
          fi

          git clone "https://x-access-token:${DIST_TOKEN}@github.com/Row0902/homebrew-tap.git" tap
          cd tap

          cat <<EOF > Formula/cutver.rb
          class Cutver < Formula
            desc "Cut a release. Bump SemVer. Every project, every language"
            homepage "https://github.com/cutver/cutver"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-macos-arm64.tar.gz"
                sha256 "${SHA_MACOS_ARM}"
              end
              on_intel do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-macos-x86_64.tar.gz"
                sha256 "${SHA_MACOS_INTEL}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-linux-musl-x86_64.tar.gz"
                sha256 "${SHA_LINUX_INTEL}"
              end
              on_arm do
                url "https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-linux-musl-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end
            end

            def install
              bin.install "cutver"
            end

            test do
              assert_match "cutver #{version}", shell_output("#{bin}/cutver --version")
            end
          end
          EOF

          sed -i 's/^          //' Formula/cutver.rb

          git config user.name "cutver-release[bot]"
          git config user.email "${{ secrets.CUTVER_APP_ID }}+cutver-release[bot]@users.noreply.github.com"
          git add Formula/cutver.rb

          if git diff --staged --quiet; then
            echo "Homebrew tap formula is already up to date with ${TAG}."
          else
            git commit -m "feat(cutver): bump cutver to ${TAG}"
            git push origin main
            echo "Successfully updated Formula/cutver.rb to ${TAG} in Row0902/homebrew-tap."
          fi

      - name: Update Scoop bucket manifest
        if: steps.bot-token.outputs.token != '' || env.HOMEBREW_TAP_TOKEN != ''
        env:
          DIST_TOKEN: ${{ steps.bot-token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${TAG#v}"

          # Extract Windows SHA-256 hashes generated in dist/SHA256SUMS
          SHA_WIN_X64=$(grep "cutver-${VERSION}-windows-x86_64.zip" dist/SHA256SUMS | awk '{print $1}')
          SHA_WIN_ARM=$(grep "cutver-${VERSION}-windows-arm64.zip" dist/SHA256SUMS | awk '{print $1}')

          if [ -z "$SHA_WIN_X64" ] || [ -z "$SHA_WIN_ARM" ]; then
            echo "::error::Failed to resolve all required Windows SHA-256 sums for Scoop manifest"
            exit 1
          fi

          git clone "https://x-access-token:${DIST_TOKEN}@github.com/Row0902/scoop-bucket.git" scoop
          cd scoop

          python3 -c "
          import json

          with open('bucket/cutver.json', 'r') as f:
              data = json.load(f)

          data['version'] = '${VERSION}'
          data['architecture'] = {
              '64bit': {
                  'url': 'https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-windows-x86_64.zip',
                  'hash': '${SHA_WIN_X64}',
                  'extract_dir': 'cutver-${VERSION}-windows-x86_64'
              },
              'arm64': {
                  'url': 'https://github.com/cutver/cutver/releases/download/${TAG}/cutver-${VERSION}-windows-arm64.zip',
                  'hash': '${SHA_WIN_ARM}',
                  'extract_dir': 'cutver-${VERSION}-windows-arm64'
              }
          }
          data['autoupdate']['architecture'] = {
              '64bit': {
                  'url': 'https://github.com/cutver/cutver/releases/download/v\$version/cutver-\$version-windows-x86_64.zip',
                  'extract_dir': 'cutver-\$version-windows-x86_64'
              },
              'arm64': {
                  'url': 'https://github.com/cutver/cutver/releases/download/v\$version/cutver-\$version-windows-arm64.zip',
                  'extract_dir': 'cutver-\$version-windows-arm64'
              }
          }

          with open('bucket/cutver.json', 'w') as f:
              json.dump(data, f, indent=4)
              f.write('\n')
          "

          git config user.name "cutver-release[bot]"
          git config user.email "${{ secrets.CUTVER_APP_ID }}+cutver-release[bot]@users.noreply.github.com"
          git add bucket/cutver.json

          if git diff --staged --quiet; then
            echo "Scoop bucket manifest is already up to date with ${TAG}."
          else
            git commit -m "cutver: Update to version ${VERSION}"
            git push origin master
            echo "Successfully updated bucket/cutver.json to ${VERSION} in Row0902/scoop-bucket."
          fi

      - name: Smoke test fresh Cutver installation
        uses: cutver/setup@v1
        with:
          version: ${{ needs.version.outputs.tag }}
          cache: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installed binary
        run: cutver --version

