[package]
name = "cutver"
version = "0.11.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["Row0902"]
description = "Cut a release. Bump SemVer. Every project, every language."
license = "MIT"
repository = "https://github.com/cutver/cutver"
keywords = ["release", "semver", "version", "changelog", "tag"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["odd/"]

[workspace]
resolver = "2"
members = ["crates/cutver-pdk"]

[dependencies]
cutver-pdk = { version = "0.1.0", path = "crates/cutver-pdk" }
clap = { version = "4", features = ["derive"] }
semver = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = "0.23"
serde_json = "1"
regex = "1"
minijinja = { version = "2", features = ["builtins"] }
rayon = "1"
extism = { version = "1.30", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = []
plugins = ["dep:extism", "dep:sha2"]

[dev-dependencies]
# `wat` is already in Cargo.lock as a transitive dependency of `wasmtime` and
# `wasm-compose` (both pulled in by the optional `extism` dependency), so this adds
# NO new crates to the resolved dependency graph. Dev-dependencies never ship in
# binaries, and this does not affect `cargo build` without `--features plugins`
# (Pillar VI.4 stays dependency-free).
wat = "1"

# `tempfile` is already in Cargo.lock as a transitive dependency of `cbindgen`
# (build tooling) and `wasmtime` (pulled in by the optional `extism` dependency),
# so this adds NO new crates to the resolved dependency graph. It provides the
# isolated, ephemeral temp directories Pillar IV.1 mandates for integration tests.
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
