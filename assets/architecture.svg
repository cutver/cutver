<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 446" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>

    <!-- Base markers -->
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-wasm-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a371f7" />
    </marker>

    <!-- Slot-colored arrow markers for high-contrast routing -->
    <marker id="arrow-slot1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-slot2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-slot3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922" />
    </marker>
    <marker id="arrow-slot4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b72" />
    </marker>

    <!-- Subtle dark card glow filter -->
    <filter id="card-glow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= TOP: cutver.toml ================= -->
  <line x1="435" y1="50" x2="435" y2="72" stroke="#484f58" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow-dark)" />

  <g transform="translate(340, 10)" filter="url(#card-glow)">
    <rect width="190" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.8" />
    <path d="M18 12 L18 28 L32 28 L32 19 L25 12 Z M25 12 L25 19 L32 19" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linejoin="round" />
    <text x="40" y="25" class="font-mono" font-size="15" font-weight="700" fill="#f0f6fc">cutver.toml</text>
  </g>

  <!-- ================= MIDDLE: CUTVER CORE ================= -->
  <g transform="translate(170, 74)" filter="url(#card-glow)">
    <!-- Main Card -->
    <rect width="530" height="110" rx="12" fill="#161b22" stroke="#388bfd" stroke-width="2.2" />
    
    <!-- Centered Header Row -->
    <g transform="translate(62, 14)">
      <!-- Badge -->
      <rect x="0" y="0" width="100" height="24" rx="12" fill="#1f6feb" />
      <text x="50" y="16.5" text-anchor="middle" class="font-sans" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">RUST CORE</text>
      
      <!-- Title -->
      <text x="114" y="19" class="font-mono" font-size="20" font-weight="800" fill="#58a6ff">cutver core</text>
      
      <!-- Subtitle -->
      <text x="256" y="19" class="font-sans" font-size="14" font-weight="500" fill="#8b949e">(atomic release engine)</text>
    </g>

    <!-- Symmetrically Spaced Capabilities Pills -->
    <g transform="translate(14, 48)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.2" />
      <text x="55" y="18" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#c9d1d9">preflight checks</text>

      <!-- Pill 2 -->
      <rect x="124" y="0" width="106" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.2" />
      <text x="177" y="18" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#c9d1d9">atomic staging</text>

      <!-- Pill 3 -->
      <rect x="244" y="0" width="106" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.2" />
      <text x="297" y="18" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#c9d1d9">surgical diffs</text>

      <!-- Pill 4 -->
      <rect x="364" y="0" width="138" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.2" />
      <text x="433" y="18" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#c9d1d9">zero-residue rollback</text>
    </g>

    <!-- Bottom Guarantee -->
    <text x="265" y="98" text-anchor="middle" class="font-sans" font-size="12.5" font-weight="500" fill="#8b949e">
      in-memory validation · zero disk mutation until atomic release
    </text>
  </g>

  <!-- ================= BUS CONNECTOR: CORE -> SLOTS ================= -->
  <!-- Main Trunk -->
  <line x1="435" y1="184" x2="435" y2="206" stroke="#484f58" stroke-width="3" />
  
  <!-- Distribution Bus -->
  <line x1="127.5" y1="206" x2="742.5" y2="206" stroke="#484f58" stroke-width="3" />
  
  <!-- Colored Destination Drops -->
  <line x1="127.5" y1="206" x2="127.5" y2="224" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow-slot1)" />
  <line x1="332.5" y1="206" x2="332.5" y2="224" stroke="#3fb950" stroke-width="3" marker-end="url(#arrow-slot2)" />
  <line x1="537.5" y1="206" x2="537.5" y2="224" stroke="#d29922" stroke-width="3" marker-end="url(#arrow-slot3)" />
  <line x1="742.5" y1="206" x2="742.5" y2="224" stroke="#ff7b72" stroke-width="3" marker-end="url(#arrow-slot4)" />

  <!-- ================= 4 TYPED CAPABILITY SLOTS ================= -->
  
  <!-- Slot 1: manifest.v1 -->
  <g transform="translate(40, 226)" filter="url(#card-glow)">
    <rect width="175" height="98" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.8" />
    <rect x="0" y="0" width="175" height="5" rx="2" fill="#58a6ff" />
    <text x="87.5" y="30" text-anchor="middle" class="font-mono" font-size="15" font-weight="800" fill="#58a6ff">manifest.v1</text>
    <text x="87.5" y="55" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#f0f6fc">Manifest Parsing</text>
    <text x="87.5" y="78" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="500" fill="#8b949e">Cargo, npm, pyproject</text>
  </g>

  <!-- Slot 2: lifecycle.v1 -->
  <g transform="translate(245, 226)" filter="url(#card-glow)">
    <rect width="175" height="98" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.8" />
    <rect x="0" y="0" width="175" height="5" rx="2" fill="#3fb950" />
    <text x="87.5" y="30" text-anchor="middle" class="font-mono" font-size="15" font-weight="800" fill="#3fb950">lifecycle.v1</text>
    <text x="87.5" y="55" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#f0f6fc">Lifecycle Hooks</text>
    <text x="87.5" y="78" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="500" fill="#8b949e">pre_bump, post_release</text>
  </g>

  <!-- Slot 3: changelog.v1 -->
  <g transform="translate(450, 226)" filter="url(#card-glow)">
    <rect width="175" height="98" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.8" />
    <rect x="0" y="0" width="175" height="5" rx="2" fill="#d29922" />
    <text x="87.5" y="30" text-anchor="middle" class="font-mono" font-size="15" font-weight="800" fill="#d29922">changelog.v1</text>
    <text x="87.5" y="55" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#f0f6fc">Release Notes</text>
    <text x="87.5" y="78" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="500" fill="#8b949e">Keep a Changelog, MD</text>
  </g>

  <!-- Slot 4: versioning.v1 -->
  <g transform="translate(655, 226)" filter="url(#card-glow)">
    <rect width="175" height="98" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.8" />
    <rect x="0" y="0" width="175" height="5" rx="2" fill="#ff7b72" />
    <text x="87.5" y="30" text-anchor="middle" class="font-mono" font-size="15" font-weight="800" fill="#ff7b72">versioning.v1</text>
    <text x="87.5" y="55" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#f0f6fc">Next SemVer</text>
    <text x="87.5" y="78" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="500" fill="#8b949e">Conventional Commits</text>
  </g>

  <!-- ================= DROPS: SLOTS -> PLUGINS ================= -->
  <line x1="127.5" y1="324" x2="127.5" y2="346" stroke="#a371f7" stroke-width="2.5" stroke-dasharray="3,3" marker-end="url(#arrow-wasm-dark)" />
  <line x1="332.5" y1="324" x2="332.5" y2="346" stroke="#a371f7" stroke-width="2.5" stroke-dasharray="3,3" marker-end="url(#arrow-wasm-dark)" />
  <line x1="537.5" y1="324" x2="537.5" y2="346" stroke="#a371f7" stroke-width="2.5" stroke-dasharray="3,3" marker-end="url(#arrow-wasm-dark)" />
  <line x1="742.5" y1="324" x2="742.5" y2="346" stroke="#a371f7" stroke-width="2.5" stroke-dasharray="3,3" marker-end="url(#arrow-wasm-dark)" />

  <!-- ================= BOTTOM: WASM PLUGINS & PDK ================= -->
  <g transform="translate(40, 348)" filter="url(#card-glow)">
    <rect width="790" height="86" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2" />
    
    <!-- Title & Description -->
    <text x="28" y="32" class="font-sans" font-size="16.5" font-weight="800" fill="#d2a8ff">
      Plugins &amp; Extensibility Layer
    </text>
    <text x="28" y="53" class="font-sans" font-size="13" font-weight="500" fill="#c9d1d9">
      Sandboxed WebAssembly runtime (Wasmtime) · Native process execution
    </text>
    <text x="28" y="72" class="font-sans" font-size="12" font-weight="500" fill="#8b949e">
      Default-deny sandbox: zero filesystem or network access without explicit grant
    </text>

    <!-- Wire Contract Badge -->
    <g transform="translate(560, 18)">
      <rect width="205" height="48" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.2" />
      <text x="102.5" y="19" text-anchor="middle" class="font-sans" font-size="10" font-weight="800" fill="#8b949e" letter-spacing="0.5">SHARED WIRE CONTRACT</text>
      <text x="102.5" y="38" text-anchor="middle" class="font-mono" font-size="14.5" font-weight="800" fill="#d2a8ff">cutver-pdk</text>
    </g>
  </g>

</svg>
