<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none" role="img" aria-labelledby="cutverAvatarTitle cutverAvatarDesc">
  <title id="cutverAvatarTitle">Cutver GitHub Organization Avatar</title>
  <desc id="cutverAvatarDesc">Squircle profile avatar for Cutver release engine featuring the geometric white C and emerald green verified checkmark.</desc>
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="grad-verified" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <filter id="avatar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#3fb950" flood-opacity="0.3" />
    </filter>

    <filter id="border-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- GitHub Organization Avatar: 512x512 Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#avatar-bg)" stroke="#30363d" stroke-width="4" filter="url(#border-shadow)" />

  <!-- Centered Cutver Mark (scale 2.1) -->
  <g transform="translate(46, 46) scale(2.1)">
    <!-- 1. The Monolithic 'C' (Rust Core Engine) -->
    <path d="M 132 37 
             L 61 37 
             L 39 59 
             L 39 113 
             L 59 133 
             L 93 99 
             L 73 99 
             L 67 93 
             L 67 65 
             L 73 59 
             L 132 59 
             Z" 
          fill="#f0f6fc" />

    <!-- 2. The '✓' / 'V' Checkmark (Verified Release) -->
    <path d="M 73 147 
             L 91 129 
             L 103 141 
             L 145 73 
             L 161 83 
             L 109 163 
             L 95 163 
             Z" 
          fill="url(#grad-verified)" filter="url(#avatar-glow)" />
  </g>
</svg>
