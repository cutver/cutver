<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none" role="img" aria-labelledby="cutverAvatarTitle cutverAvatarDesc">
  <title id="cutverAvatarTitle">Cutver GitHub Organization Avatar</title>
  <desc id="cutverAvatarDesc">Full-bleed official profile avatar for Cutver release engine featuring the geometric white C and emerald green verified checkmark with safe-area padding.</desc>
  <defs>
    <!-- Full-bleed background gradient -->
    <linearGradient id="avatar-bg-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Subtle radial glow behind mark -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="grad-verified" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <filter id="avatar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#3fb950" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Full-bleed 512x512 solid background (fills corners completely so GitHub's crop is seamless) -->
  <rect width="512" height="512" fill="url(#avatar-bg-full)" />
  <rect width="512" height="512" fill="url(#center-glow)" />

  <!-- 2. Centered Cutver Mark with generous Safe-Area breathing room (scale 1.65) -->
  <g transform="translate(91, 91) scale(1.65)">
    <!-- The Monolithic 'C' (Rust Core Engine) -->
    <path d="M 132 37 
             L 61 37 
             L 39 59 
             L 39 113 
             L 59 133 
             L 93 99 
             L 73 99 
             L 67 93 
             L 67 65 
             L 73 59 
             L 132 59 
             Z" 
          fill="#f0f6fc" />

    <!-- The '✓' / 'V' Checkmark (Verified Release) -->
    <path d="M 73 147 
             L 91 129 
             L 103 141 
             L 145 73 
             L 161 83 
             L 109 163 
             L 95 163 
             Z" 
          fill="url(#grad-verified)" filter="url(#avatar-glow)" />
  </g>
</svg>
