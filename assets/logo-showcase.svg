<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="grad-rust-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b54" />
      <stop offset="100%" stop-color="#d9381e" />
    </linearGradient>

    <!-- Verified Green / Emerald Gradient -->
    <linearGradient id="grad-verified" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- WASM Purple Gradient -->
    <linearGradient id="grad-wasm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8250df" />
    </linearGradient>

    <linearGradient id="card-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <filter id="shadow-lg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-verified" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3fb950" flood-opacity="0.35" />
    </filter>

    <filter id="glow-hero" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff7b54" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="820" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2" />

  <!-- Showcase Header -->
  <g transform="translate(60, 45)">
    <rect width="105" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="52.5" y="16" text-anchor="middle" class="font-sans" font-size="11" font-weight="700" fill="#3fb950" letter-spacing="0.5">EVOLUCIÓN V2</text>
    <text x="120" y="18" class="font-mono" font-size="24" font-weight="800" fill="#f0f6fc">Cutver · "The Verified Cut" (C + ✓/V)</text>
    <text x="0" y="46" class="font-sans" font-size="14" fill="#8b949e">
      Fusión de la solidez de ingeniería con el checkmark de verificación preflight y el corte atómico
    </text>
  </g>

  <!-- ========================================================== -->
  <!-- HERO CANDIDATE: THE VERIFIED CUT (Rust Core + Green Check) -->
  <!-- ========================================================== -->
  <g transform="translate(60, 125)">
    <!-- Card container with subtle highlight border -->
    <rect width="420" height="450" rx="14" fill="url(#card-dark)" stroke="#3fb950" stroke-width="2" filter="url(#shadow-lg)" />
    
    <!-- Recommended Badge -->
    <g transform="translate(24, 24)">
      <rect width="160" height="24" rx="6" fill="#238636" />
      <text x="80" y="16" text-anchor="middle" class="font-sans" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">⭐ CANDIDATO PRINCIPAL</text>
    </g>

    <text x="24" y="74" class="font-mono" font-size="16" font-weight="700" fill="#f0f6fc">The Verified Cut (Rust + Emerald)</text>
    <text x="24" y="94" class="font-sans" font-size="12" fill="#8b949e">C superior (Rust Engine) + Checkmark/V (Auditado/Preflights)</text>

    <!-- Logo Mark Preview (Centered) -->
    <g transform="translate(110, 115)">
      <!-- Squircle Container -->
      <rect width="200" height="200" rx="42" fill="#0d1117" stroke="#30363d" stroke-width="2" />
      
      <!-- GLYPH: GEOMETRIC PRECISION -->
      <g transform="translate(20, 20)">
        <!-- Laser Cut Guideline (45 deg) -->
        <line x1="20" y1="140" x2="140" y2="20" stroke="#484f58" stroke-width="2" stroke-dasharray="3,3" opacity="0.3" />

        <!-- 1. The 'C' Monogram (Top-Left): Hard chamfers, heavyweight block -->
        <path d="M 125 32 
                 L 54 32 
                 L 32 54 
                 L 32 108 
                 L 52 128 
                 L 86 94 
                 L 66 94 
                 L 60 88 
                 L 60 60 
                 L 66 54 
                 L 125 54 
                 Z" 
              fill="url(#grad-rust-core)" filter="url(#glow-hero)" />

        <!-- 2. The '✓' / 'V' Checkmark (Bottom-Right): Razor-sharp apex, long soaring arm -->
        <path d="M 66 142 
                 L 84 124 
                 L 96 136 
                 L 138 68 
                 L 154 78 
                 L 102 158 
                 L 88 158 
                 Z" 
              fill="url(#grad-verified)" filter="url(#glow-verified)" />
      </g>
    </g>

    <!-- Wordmark lockup preview -->
    <g transform="translate(24, 340)">
      <text x="186" y="28" text-anchor="middle" class="font-mono" font-size="24" font-weight="800" fill="#f0f6fc">cutver</text>
      <text x="186" y="50" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="700" fill="#3fb950" letter-spacing="2">ATOMIC RELEASE ENGINE · VERIFIED</text>
    </g>

    <!-- Scale test badges -->
    <g transform="translate(85, 405)">
      <rect width="64" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="32" y="17" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#8b949e">64x64</text>

      <rect x="74" width="54" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="101" y="17" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#8b949e">32x32</text>

      <rect x="138" width="54" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="165" y="17" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#8b949e">16x16</text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- VARIANT B: MONOCHROME SOLID (White & Emerald)              -->
  <!-- ========================================================== -->
  <g transform="translate(510, 125)">
    <!-- Card container -->
    <rect width="320" height="450" rx="14" fill="url(#card-dark)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow-lg)" />
    
    <text x="24" y="40" class="font-mono" font-size="15" font-weight="700" fill="#f0f6fc">Variante B: White C + Green ✓</text>
    <text x="24" y="60" class="font-sans" font-size="12" fill="#8b949e">C en blanco puro monolítico con check verde</text>

    <!-- Logo Mark Preview -->
    <g transform="translate(60, 95)">
      <rect width="200" height="200" rx="42" fill="#0d1117" stroke="#21262d" stroke-width="1.5" />
      
      <g transform="translate(20, 20)">
        <!-- Solid White C -->
        <path d="M 125 32 
                 L 54 32 
                 L 32 54 
                 L 32 108 
                 L 52 128 
                 L 86 94 
                 L 66 94 
                 L 60 88 
                 L 60 60 
                 L 66 54 
                 L 125 54 
                 Z" 
              fill="#f0f6fc" />

        <!-- Sharp Emerald Checkmark -->
        <path d="M 66 142 
                 L 84 124 
                 L 96 136 
                 L 138 68 
                 L 154 78 
                 L 102 158 
                 L 88 158 
                 Z" 
              fill="#3fb950" filter="url(#glow-verified)" />
      </g>
    </g>

    <!-- Wordmark lockup preview -->
    <g transform="translate(24, 325)">
      <text x="136" y="28" text-anchor="middle" class="font-mono" font-size="22" font-weight="800" fill="#f0f6fc">cutver</text>
      <text x="136" y="48" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1.5">WHITE MONOGRAM</text>
    </g>

    <!-- Description box -->
    <g transform="translate(20, 385)">
      <rect width="280" height="42" rx="8" fill="#21262d" />
      <text x="140" y="25" text-anchor="middle" class="font-sans" font-size="11" fill="#c9d1d9">
        Máximo contraste en fondos oscuros de GitHub
      </text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- VARIANT C: RUST + WASM ELECTRIC (Purple Check)             -->
  <!-- ========================================================== -->
  <g transform="translate(855, 125)">
    <!-- Card container -->
    <rect width="285" height="450" rx="14" fill="url(#card-dark)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow-lg)" />
    
    <text x="24" y="40" class="font-mono" font-size="15" font-weight="700" fill="#c084fc">Variante C: Rust + Wasm</text>
    <text x="24" y="60" class="font-sans" font-size="12" fill="#8b949e">C en naranja Rust con check en violeta</text>

    <!-- Logo Mark Preview -->
    <g transform="translate(42, 95)">
      <rect width="200" height="200" rx="42" fill="#0d1117" stroke="#21262d" stroke-width="1.5" />
      
      <g transform="translate(20, 20)">
        <!-- Rust Core C -->
        <path d="M 125 32 
                 L 54 32 
                 L 32 54 
                 L 32 108 
                 L 52 128 
                 L 86 94 
                 L 66 94 
                 L 60 88 
                 L 60 60 
                 L 66 54 
                 L 125 54 
                 Z" 
              fill="url(#grad-rust-core)" />

        <!-- Wasm Electric Violet Check -->
        <path d="M 66 142 
                 L 84 124 
                 L 96 136 
                 L 138 68 
                 L 154 78 
                 L 102 158 
                 L 88 158 
                 Z" 
              fill="url(#grad-wasm)" />
      </g>
    </g>

    <!-- Wordmark lockup preview -->
    <g transform="translate(24, 325)">
      <text x="118" y="28" text-anchor="middle" class="font-mono" font-size="22" font-weight="800" fill="#f0f6fc">cutver</text>
      <text x="118" y="48" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#c084fc" letter-spacing="1.5">WASM EXTENSIBILITY</text>
    </g>

    <!-- Description box -->
    <g transform="translate(18, 385)">
      <rect width="250" height="42" rx="8" fill="#21262d" />
      <text x="125" y="25" text-anchor="middle" class="font-sans" font-size="11" fill="#c9d1d9">
        Refuerza el motor WASM de plugins
      </text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- REAL-WORLD INTEGRATION BENCHMARK (Bottom Panel)            -->
  <!-- ========================================================== -->
  <g transform="translate(60, 600)">
    <rect width="1080" height="180" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <text x="30" y="34" class="font-mono" font-size="14" font-weight="700" fill="#f0f6fc">Pruebas en Entornos Reales de GitHub</text>

    <!-- 1. The Official Badge -->
    <g transform="translate(30, 56)">
      <rect width="235" height="36" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      
      <!-- Tiny Precision Icon -->
      <g transform="translate(10, 8) scale(0.12)">
        <path d="M 125 32 L 54 32 L 32 54 L 32 108 L 52 128 L 86 94 L 66 94 L 60 88 L 60 60 L 66 54 L 125 54 Z" fill="#ff7b54" />
        <path d="M 66 142 L 84 124 L 96 136 L 138 68 L 154 78 L 102 158 L 88 158 Z" fill="#3fb950" />
      </g>
      
      <text x="36" y="23" class="font-sans" font-size="12" font-weight="500" fill="#8b949e">released with:</text>
      <text x="120" y="23" class="font-mono" font-size="13" font-weight="700" fill="#f0f6fc">cutver</text>
      
      <rect x="175" y="7" width="50" height="22" rx="4" fill="#238636" />
      <text x="200" y="22" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#ffffff">0.13.0</text>
    </g>

    <!-- 2. Terminal CLI Output -->
    <g transform="translate(290, 56)">
      <rect width="450" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#ff5f56" />
      <circle cx="28" cy="16" r="4" fill="#ffbd2e" />
      <circle cx="40" cy="16" r="4" fill="#27c93f" />
      <text x="16" y="44" class="font-mono" font-size="12" fill="#58a6ff">$ cutver doctor</text>
      <text x="16" y="66" class="font-mono" font-size="12" fill="#3fb950">✓ manifests synchronized · no changelog drift · preflights passed</text>
      <text x="16" y="86" class="font-mono" font-size="12" fill="#8b949e">Workspace healthy. Ready to bump SemVer atomically.</text>
    </g>

    <!-- 3. GitHub Organization Avatar 1:1 -->
    <g transform="translate(765, 56)">
      <rect width="285" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
      
      <!-- Avatar 64x64 -->
      <rect x="16" y="18" width="64" height="64" rx="16" fill="#161b22" stroke="#3fb950" stroke-width="1.8" />
      <g transform="translate(22, 24) scale(0.26)">
        <path d="M 125 32 L 54 32 L 32 54 L 32 108 L 52 128 L 86 94 L 66 94 L 60 88 L 60 60 L 66 54 L 125 54 Z" fill="#ff7b54" />
        <path d="M 66 142 L 84 124 L 96 136 L 138 68 L 154 78 L 102 158 L 88 158 Z" fill="#3fb950" />
      </g>
      
      <text x="92" y="44" class="font-sans" font-size="15" font-weight="700" fill="#f0f6fc">cutver</text>
      <text x="92" y="64" class="font-sans" font-size="12" fill="#8b949e">github.com/cutver</text>
    </g>
  </g>

</svg>
