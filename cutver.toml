# cutver's own release configuration — dogfooding.
# Every future bump of this crate runs through this tool.

[project]
name = "cutver"

[[manifest]]
path = "Cargo.toml"
kind = "cargo-package"

[preflight]
# The plugin feature gates the WebAssembly driver, so the default build never
# compiles or tests it. Cutting a release through this configuration without the
# feature would ship the plugin contract without exercising it.
tests = "cargo test --features plugins"
# The feature pulls in the Extism and Wasmtime stack, which is the slowest thing
# this gate compiles from a cold cache. The previous 600s budget was sized for a
# build that never touched it.
default_timeout = 1200

[changelog]
path = "CHANGELOG.md"
format = "keep-a-changelog"
mode = "template"
template_file = ".github/templates/cutver/RELEASE.md"

[git]
tag_prefix = "v"
commit_message = "chore(release): v{{ version }} [skip ci]"
require_clean_tree = true
require_branch = "main"
floating_major_tag = true

[hooks]
# `--workspace` also compiles the `cutver-pdk` member, so a change that breaks the wire
# contract fails this gate instead of shipping. That member is versioned independently and
# published on its own schedule (`cargo publish -p cutver-pdk`); a CLI release never
# republishes it, because its version tracks the wire contract and not the binary.
post_bump = "cargo check --workspace --features plugins"

[publish]
# Publishes the root package only. `cutver-pdk` is a separate crates.io package with its own
# version, and bumping the CLI is not evidence that its API changed.
push = true
commands = ["cargo publish"]
default_timeout = 300

# Publishing the release itself, through the microkernel rather than a shell command.
#
# The dry-run rehearsal in this repository's release workflow exercises the plugin's
# `on_pre_bump` (token validity and tag collision against the API) before the step that
# replaces softprops/action-gh-release. `on_post_release` creates the release as a draft, so a
# failed build cannot leave a public release without assets.
#
# A lean build cannot load this: `bump` fails closed with `PluginError::WasmNotSupported`. Run
# the plugin-enabled variant (the `cutver-plugins-*` archive) when releasing.
[plugins.github-publish]
runtime = "wasm"
source = "github-publish-0.1.2.wasm"
hash = "5f44775e7b6f14a0b7cc57c19a3c694b5f3c177971f797e1a61177bcc0ae5b23"
capabilities = ["lifecycle.v1"]
events = ["on_pre_bump", "on_post_release"]

[plugins.github-publish.permissions]
network = ["api.github.com", "uploads.github.com"]
env = ["GITHUB_TOKEN", "GITHUB_REPOSITORY"]
# Grants the whole workspace tree, wider than the two files the plugin reads. Kept to match the
# configuration cutver/sandbox validates rather than guessing at a narrower set.
filesystem = ["."]

[plugins.github-publish.config]
repository = "cutver/cutver"
# Required, and its default is false. Without it the plugin publishes a public, asset-less
# release during the version job, before the binaries are built: the exact failure the draft
# exists to prevent. The publish job uploads the assets and publishes it afterwards.
draft = true
