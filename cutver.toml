# cutver's own release configuration — dogfooding.
# Every future bump of this crate runs through this tool.

[project]
name = "cutver"

[[manifest]]
path = "Cargo.toml"
kind = "cargo-package"

[preflight]
# The plugin feature gates the WebAssembly driver, so the default build never
# compiles or tests it. Cutting a release through this configuration without the
# feature would ship the plugin contract without exercising it.
tests = "cargo test --features plugins"
# The feature pulls in the Extism and Wasmtime stack, which is the slowest thing
# this gate compiles from a cold cache. The previous 600s budget was sized for a
# build that never touched it.
default_timeout = 1200

[changelog]
path = "CHANGELOG.md"
format = "keep-a-changelog"
mode = "template"
template_file = ".github/templates/cutver/RELEASE.md"

[git]
tag_prefix = "v"
commit_message = "chore(release): v{{ version }} [skip ci]"
require_clean_tree = true
require_branch = "main"
floating_major_tag = true

[hooks]
# `--workspace` covers the `cutver-pdk` member, which a release also republishes.
post_bump = "cargo check --workspace --features plugins"

[publish]
push = true
commands = ["cargo publish"]
default_timeout = 300
