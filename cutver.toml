# cutver's own release configuration — dogfooding: every bump of this crate runs through this tool.
# A comment here says why this repository deviates from a default. What a key does lives in
# docs/reference/configuration-tables.md, which is the contract and is maintained there.

[project]
name = "cutver"

[[manifest]]
path = "Cargo.toml"
kind = "cargo-package"

[preflight]
# The default build never compiles the WebAssembly driver, so the gate must exercise the feature
# the release will ship.
tests = "cargo test --features plugins"
# Sized for that stack from a cold cache, which is the slowest thing this gate compiles.
default_timeout = 1200

[changelog]
path = "CHANGELOG.md"
format = "keep-a-changelog"
mode = "template"
template_file = ".github/templates/cutver/RELEASE.md"

[git]
tag_prefix = "v"
commit_message = "chore(release): v{{ version }} [skip ci]"
require_clean_tree = true
require_branch = "main"
floating_major_tag = true

[hooks]
# Phase 1, before any manifest is touched: an unformatted tree must not become a release commit.
pre_bump = "cargo fmt --all -- --check"
# `--workspace` also compiles the `cutver-pdk` member, so a break in the wire contract fails here
# instead of shipping. That member carries its own version and its own publication schedule.
post_bump = "cargo check --workspace --features plugins"
# Neither hook is killed without this key — an absent timeout means no bound at all — and 1200 is
# the `[preflight]` budget for the same cold Extism and Wasmtime compile.
default_timeout = 1200

[gates]
# `publish` refuses without these verdicts, and only the release workflow writes them: the smoke
# matrix passed for the release commit. They live outside the workflow's `needs:` graph on purpose,
# so reordering a job or re-running `publish` alone still cannot skip the smoke.
require = ["smoke", "smoke-plugins"]

[publish]
# The root package only: `cutver-pdk` carries its own version, and bumping the CLI is not evidence
# that its API changed.
push = true
# Publication was paused while the GitHub path was proven, so v0.16.0 was never published and the
# gap 0.15.0 -> 0.17.0 is permanent. Never close it with `--no-verify`: it would ship a crate that
# does not compile for its consumers.
commands = ["cargo publish"]
default_timeout = 300

[plugins.github-publish]
# A lean build cannot load this and fails closed with `WasmNotSupported`; release with the
# `cutver-plugins-*` archive. 0.2.1 is valid from here on, because each release is cut by the
# previously published binary.
runtime = "wasm"
source = "github-publish-0.2.1.wasm"
hash = "0a38c934200f833a35cae3a53c03c403566f42f4abc58a744a7b2d8a09874a9b"
capabilities = ["lifecycle.v1"]
events = ["on_pre_bump", "on_post_release"]

[plugins.github-publish.permissions]
network = ["api.github.com", "uploads.github.com"]
env = ["GITHUB_TOKEN", "GITHUB_REPOSITORY"]
# Wider than the two files the plugin reads, kept to match the configuration cutver/sandbox validates.
filesystem = ["."]

[plugins.github-publish.config]
repository = "cutver/cutver"
# The plugin's default is false, and without it the plugin publishes a public, asset-less release
# during the version job, before the binaries exist. Whether this table reaches the plugin at all is
# unverified: the host does not deliver `[plugins.<name>.config]` (#317).
draft = true
title_template = "cutver {version}"
# `checksums` and `generate_release_notes` stay unset on purpose: they cover assets the publish job
# uploads afterward with `gh release upload`, and notes this repository renders itself.
